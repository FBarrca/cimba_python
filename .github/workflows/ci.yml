name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Test Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Check component compilation cache
        run: >-
          uv run python benchmark/component_compilation.py
          --runs 2 --scenario synthetic --scales 10 --cache warm --check
          --json build/component-compilation-linux.json

      - name: Upload component benchmark
        uses: actions/upload-artifact@v7
        with:
          name: component-compilation-linux
          path: build/component-compilation-linux.json
          if-no-files-found: error

  test-windows:
    name: Test Windows
    runs-on: windows-2025
    env:
      CC: clang-cl

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install NASM
        run: choco install nasm --no-progress -y

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Run tests
        shell: pwsh
        run: |
          uv run pytest 2>&1 | Tee-Object -FilePath ci-pytest.log
          $pytestExit = $LASTEXITCODE
          if ($pytestExit -ne 0) {
            $message = (Get-Content ci-pytest.log -Tail 100) -join "`n"
            $message = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows pytest failed::$message"
          }
          exit $pytestExit

      - name: Check component compilation cache
        run: >-
          uv run python benchmark/component_compilation.py
          --runs 2 --scenario synthetic --scales 10 --cache warm --check
          --json build/component-compilation-windows.json

      - name: Upload component benchmark
        uses: actions/upload-artifact@v7
        with:
          name: component-compilation-windows
          path: build/component-compilation-windows.json
          if-no-files-found: error

  test-macos:
    name: Test macOS (Apple Silicon)
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Verify native architecture
        run: test "$(uname -m)" = "arm64"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        shell: bash
        run: |
          set +e
          uv sync --locked 2>&1 | tee ci-sync.log
          sync_exit=${PIPESTATUS[0]}
          if [ "$sync_exit" -ne 0 ]; then
            message="$(tail -n 100 ci-sync.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=macOS dependency build failed::$message"
          fi
          exit "$sync_exit"

      - name: Run tests
        run: uv run pytest

      - name: Check component compilation cache
        run: >-
          uv run python benchmark/component_compilation.py
          --runs 2 --scenario synthetic --scales 10 --cache warm --check
          --json build/component-compilation-macos-arm64.json

      - name: Upload component benchmark
        uses: actions/upload-artifact@v7
        with:
          name: component-compilation-macos-arm64
          path: build/component-compilation-macos-arm64.json
          if-no-files-found: error

  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    needs: [test-linux, test-windows, test-macos]
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install Python build dependencies
        run: uv sync --locked --only-group build --no-install-project

      - name: Build source and wheel distributions
        run: uv build

      - name: Smoke-test built wheel
        run: uv run --no-project --isolated --with dist/*.whl python -c "import cimba; print(cimba.native_version())"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: local-distributions
          path: dist/*
          if-no-files-found: error
