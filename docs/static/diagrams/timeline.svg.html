<div class="cdiag"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" role="img" aria-labelledby="t-timeline d-timeline">
<title id="t-timeline">The measurement window of a trial</title><desc id="d-timeline">A trial runs a warm-up, a measurement window, a cool-down and a drain phase, then on_end hooks.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M 0 0 L 10 5 L 0 10 z"/></marker>
<marker id="arrow-pillar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead pillar" d="M 0 0 L 10 5 L 0 10 z"/></marker>
</defs>
<text class="band-label" x="40" y="24">One trial</text>
<rect x="40" y="70" width="170" height="46" rx="4" ry="4" style="fill:#eef2f7;stroke:#9aa5b1;stroke-width:1.4"/>
<text class="title plain" x="125.0" y="90" text-anchor="middle">warm-up</text>
<text class="sub" x="125.0" y="134" text-anchor="middle">processes run</text>
<text class="sub" x="125.0" y="148" text-anchor="middle">statistics not kept</text>
<rect x="210" y="70" width="360" height="46" rx="4" ry="4" style="fill:#e3f0fb;stroke:#2980b9;stroke-width:1.4"/>
<text class="title plain" x="390.0" y="90" text-anchor="middle">measurement (duration)</text>
<text class="sub" x="390.0" y="134" text-anchor="middle">time-weighted statistics recorded · datasets cleared at start</text>
<rect x="570" y="70" width="170" height="46" rx="4" ry="4" style="fill:#f5f7fa;stroke:#9aa5b1;stroke-width:1.4"/>
<text class="title plain" x="655.0" y="90" text-anchor="middle">cool-down</text>
<text class="sub" x="655.0" y="134" text-anchor="middle">work in flight finishes</text>
<text class="sub" x="655.0" y="148" text-anchor="middle">datasets still record</text>
<rect x="740" y="70" width="90" height="46" rx="4" ry="4" style="fill:#ffffff;stroke:#b8c2cc;stroke-width:1.4" stroke-dasharray="4 3"/>
<text class="title plain" x="785.0" y="90" text-anchor="middle">drain</text>
<text class="sub" x="785.0" y="134" text-anchor="middle">static processes stopped</text>
<text class="sub" x="785.0" y="148" text-anchor="middle">events run out</text>
<line x1="40" y1="58" x2="40" y2="116" style="stroke:#52606d;stroke-width:1"/>
<text class="edge-label" x="40" y="52" text-anchor="middle">t = 0</text>
<line x1="210" y1="58" x2="210" y2="116" style="stroke:#52606d;stroke-width:1"/>
<text class="edge-label" x="210" y="52" text-anchor="middle">warmup</text>
<line x1="570" y1="58" x2="570" y2="116" style="stroke:#52606d;stroke-width:1"/>
<text class="edge-label" x="570" y="52" text-anchor="middle">warmup + duration</text>
<line x1="740" y1="58" x2="740" y2="116" style="stroke:#52606d;stroke-width:1"/>
<text class="edge-label" x="740" y="52" text-anchor="middle">+ cooldown</text>
<line x1="830" y1="58" x2="830" y2="116" style="stroke:#52606d;stroke-width:1"/>
<rect class="box " x="848" y="70" width="110" height="46" rx="6" ry="6"/>
<text class="title" x="903.0" y="90.0" text-anchor="middle">on_end</text>
<text class="sub" x="903.0" y="106.0" text-anchor="middle">hooks, bottom-up</text>
<path class="edge " d="M 830 93.0 L 846 93.0" marker-end="url(#arrow)"/>
<text class="sub" x="40" y="180">on_start hooks run and processes start at t = 0. Window.until_idle() has no warm-up or cool-down: it records from 0 until no events remain.</text>
</svg></div>
